---
name: Blackbox exporter SPKI

# Builds the image DocPad_IaC deploys (Dockerfile.spki). One image per commit:
# the tag is the commit SHA and is never re-pushed, so every environment that
# pins the tag runs the same digest and no deployed digest becomes untagged.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/paradigmatic-innovations/blackbox-exporter-spki

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          # A re-run must not replace the image under an existing tag: the base
          # image and CA bundle float, so a rebuild would yield a new digest.
          if docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" > /dev/null 2>&1; then
            echo "${IMAGE}:${GITHUB_SHA} already exists, not rebuilding." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.spki \
            --build-arg REVISION="${GITHUB_SHA}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --metadata-file image-metadata.json \
            --push \
            .

          DIGEST=$(jq -r '."containerimage.digest"' image-metadata.json)
          echo "Pushed ${IMAGE}:${GITHUB_SHA}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
